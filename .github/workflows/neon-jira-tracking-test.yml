
name: Neon Jira Change Tracking Test

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Look back this many hours for Jira changes"
        required: true
        default: "168"
        type: string

  push:
    branches:
      - test-gemini-api

permissions: {}

concurrency:
  group: neon-jira-change-tracking
  cancel-in-progress: false

jobs:
  track-jira-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
      LOOKBACK_HOURS: ${{ inputs.hours || '168' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL driver
        run: python -m pip install --disable-pip-version-check "psycopg[binary]"

      - name: Track Jira changes and analyse with Gemini
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import socket
          import sys
          import time
          from datetime import datetime, timedelta, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          import psycopg
          from psycopg.types.json import Jsonb

          print("=" * 40)
          print("Neon Jira Change Tracking Test")
          print("=" * 40)

          JIRA_URL = os.environ["JIRA_URL"].rstrip("/")
          JIRA_EMAIL = os.environ["JIRA_EMAIL"]
          JIRA_API_TOKEN = os.environ["JIRA_API_TOKEN"]
          PROJECT_KEY = os.environ["JIRA_PROJECT_KEY"].strip()
          DATABASE_URL = os.environ["DATABASE_URL"]
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]
          GEMINI_MODEL = os.environ.get(
              "GEMINI_MODEL", "gemini-3.8-flash"
          )
          MAX_ISSUES = 10
          MAX_GEMINI_RECORDS = 5
          MAX_DB_ATTEMPTS = 3
          GEMINI_TIMEOUT = 30
          RETRY_DELAYS = [2, 5]

          try:
              HOURS = int(os.environ.get("LOOKBACK_HOURS", "168"))
          except ValueError:
              print("ERROR: Lookback hours must be a whole number.")
              sys.exit(1)

          if HOURS < 1 or HOURS > 2160:
              print("ERROR: Lookback hours must be between 1 and 2160.")
              sys.exit(1)

          required = {
              "JIRA_URL": JIRA_URL,
              "JIRA_EMAIL": JIRA_EMAIL,
              "JIRA_API_TOKEN": JIRA_API_TOKEN,
              "JIRA_PROJECT_KEY": PROJECT_KEY,
              "DATABASE_URL": DATABASE_URL,
              "GEMINI_API_KEY": GEMINI_API_KEY,
          }

          missing = [name for name, value in required.items() if not value]
          if missing:
              print("ERROR: Missing configuration: " + ", ".join(missing))
              sys.exit(1)

          now = datetime.now(timezone.utc)
          cutoff = now - timedelta(hours=HOURS)

          print(f"Project: {PROJECT_KEY}")
          print(f"Lookback window: {HOURS} hours")
          print(f"Maximum issues to inspect: {MAX_ISSUES}")
          print(f"Gemini model: {GEMINI_MODEL}")
          print("Gemini calls: enabled")

          def jira_get_json(path, params=None):
              url = f"{JIRA_URL}{path}"
              if params:
                  url += "?" + urlencode(params)

              import base64
              credentials = base64.b64encode(
                  f"{JIRA_EMAIL}:{JIRA_API_TOKEN}".encode()
              ).decode()

              request = Request(
                  url,
                  headers={
                      "Authorization": f"Basic {credentials}",
                      "Accept": "application/json",
                  },
                  method="GET",
              )

              with urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def parse_jira_datetime(value):
              if not value:
                  return None

              parsed = datetime.fromisoformat(
                  value.replace("Z", "+00:00")
              )

              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=timezone.utc)

              return parsed.astimezone(timezone.utc)

          def get_recent_issues():
              jql = (
                  f'project = "{PROJECT_KEY}" '
                  f'AND updated >= -{HOURS}h '
                  "ORDER BY updated DESC"
              )

              data = jira_get_json(
                  "/rest/api/3/search/jql",
                  {
                      "jql": jql,
                      "maxResults": MAX_ISSUES,
                      "fields": "summary,updated",
                  },
              )

              return data.get("issues", [])

          def get_issue_changelog(issue_key):
              all_histories = []
              start_at = 0
              page_size = 100

              while True:
                  data = jira_get_json(
                      f"/rest/api/3/issue/{issue_key}/changelog",
                      {
                          "startAt": start_at,
                          "maxResults": page_size,
                      },
                  )

                  histories = data.get("values", [])
                  all_histories.extend(histories)

                  if data.get("isLast", False):
                      break

                  if not histories:
                      break

                  start_at += len(histories)

                  total = data.get("total")
                  if total is not None and start_at >= total:
                      break

              return all_histories

          def gemini_analyse(issue_key, summary, changed_at, changed_fields):
              prompt = f"""
          You are a senior software QA analyst reviewing a Jira change.

          Jira issue: {issue_key}
          Summary: {summary}
          Change timestamp (UTC): {changed_at.isoformat()}

          Changed fields and values:
          {json.dumps(changed_fields, ensure_ascii=False, indent=2, default=str)}

          Analyse this change from a software testing perspective.

          Please identify:
          1. What changed, in plain language.
          2. Potential impact on existing functionality or business rules.
          3. Relevant regression-testing areas.
          4. Possible ambiguities, contradictions, or missing acceptance criteria.
          5. Suggested questions for the product owner or business analyst, if needed.

          Do not invent requirements or claim that a defect exists without evidence.
          Clearly distinguish confirmed facts from reasonable testing concerns.
          If the change is too small or unclear to assess, say so.
          Keep the response concise and actionable for a QA tester.
          """.strip()

              url = (
                  "https://generativelanguage.googleapis.com/v1beta/"
                  f"models/{GEMINI_MODEL}:generateContent"
              )

              payload = {
                  "contents": [
                      {
                          "parts": [
                              {"text": prompt}
                          ]
                      }
                  ],
                  "generationConfig": {
                      "maxOutputTokens": 800
                  },
              }

              request_body = json.dumps(payload).encode("utf-8")
              last_error = None

              # Three network attempts, with increasing waits between them.
              # The API key is sent in a header, not included in the URL.
              for attempt in range(1, len(RETRY_DELAYS) + 2):
                  request = Request(
                      url,
                      data=request_body,
                      headers={
                          "Content-Type": "application/json",
                          "x-goog-api-key": GEMINI_API_KEY,
                      },
                      method="POST",
                  )

                  try:
                      with urlopen(
                          request, timeout=GEMINI_TIMEOUT
                      ) as response:
                          result = json.loads(
                              response.read().decode("utf-8")
                          )

                      candidates = result.get("candidates", [])
                      if not candidates:
                          raise RuntimeError(
                              "Gemini returned no response candidates."
                          )

                      parts = (
                          candidates[0]
                          .get("content", {})
                          .get("parts", [])
                      )
                      answer = "\n".join(
                          part.get("text", "")
                          for part in parts
                          if part.get("text")
                      ).strip()

                      if not answer:
                          raise RuntimeError(
                              "Gemini returned no analysis text."
                          )

                      return answer

                  except HTTPError as exc:
                      last_error = RuntimeError(
                          f"Gemini API returned HTTP {exc.code}"
                      )

                      # Retry only temporary service/rate-limit errors.
                      if exc.code not in (408, 429, 500, 502, 503, 504):
                          raise last_error from exc

                  except (URLError, TimeoutError, socket.timeout) as exc:
                      last_error = RuntimeError(
                          f"Gemini network error: {type(exc).__name__}"
                      )

                  if attempt <= len(RETRY_DELAYS):
                      delay = RETRY_DELAYS[attempt - 1]
                      print(
                          f"  Temporary Gemini error on network attempt "
                          f"{attempt}/3. Retrying in {delay} seconds."
                      )
                      time.sleep(delay)

              raise last_error or RuntimeError(
                  "Gemini failed after all network attempts."
              )

          new_changes = 0
          known_changes = 0
          older_changes = 0
          entries_examined = 0
          analyses_performed = 0
          analyses_failed = 0

          try:
              connection = psycopg.connect(DATABASE_URL)

              with connection:
                  with connection.cursor() as cursor:
                      issues = get_recent_issues()

                      print(
                          f"Recently updated issues found: {len(issues)}"
                      )

                      for issue in issues:
                          issue_key = issue["key"]
                          fields = issue.get("fields", {})
                          summary = fields.get("summary", "(No summary)")

                          print(f"\nInspecting {issue_key}: {summary}")

                          histories = get_issue_changelog(issue_key)
                          issue_new = 0

                          for history in histories:
                              created = parse_jira_datetime(
                                  history.get("created")
                              )

                              if created is None:
                                  continue

                              if created < cutoff:
                                  older_changes += 1
                                  continue

                              entries_examined += 1

                              changed_fields = []
                              for item in history.get("items", []):
                                  changed_fields.append({
                                      "field": item.get("field"),
                                      "field_type": item.get("fieldtype"),
                                      "from": item.get("fromString"),
                                      "to": item.get("toString"),
                                  })

                              if not changed_fields:
                                  continue

                              cursor.execute(
                                  """
                                  INSERT INTO jira_changes (
                                      issue_key,
                                      changelog_id,
                                      changed_at,
                                      changed_fields,
                                      status,
                                      attempt_count,
                                      discovered_at
                                  )
                                  VALUES (%s, %s, %s, %s, 'pending', 0, NOW())
                                  ON CONFLICT (issue_key, changelog_id)
                                  DO NOTHING
                                  """,
                                  (
                                      issue_key,
                                      str(history["id"]),
                                      created,
                                      Jsonb(changed_fields),
                                  ),
                              )

                              if cursor.rowcount == 1:
                                  new_changes += 1
                                  issue_new += 1
                              else:
                                  known_changes += 1

                          print(f"  Newly recorded changes: {issue_new}")

              # Commit discovery before calling Gemini. A Gemini outage
              # must not undo the Jira change records already saved.
              connection.commit()

              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      SELECT
                          id,
                          issue_key,
                          changed_at,
                          changed_fields,
                          COALESCE(attempt_count, 0)
                      FROM jira_changes
                      WHERE status IN ('pending', 'failed')
                        AND COALESCE(attempt_count, 0) < %s
                      ORDER BY changed_at ASC, id ASC
                      LIMIT %s
                      """,
                      (MAX_DB_ATTEMPTS, MAX_GEMINI_RECORDS),
                  )
                  queued_records = cursor.fetchall()

              connection.commit()

              print(
                  "\nEligible changes queued for Gemini: "
                  f"{len(queued_records)}"
              )

              for (
                  record_id,
                  issue_key,
                  changed_at,
                  changed_fields,
                  previous_attempts,
              ) in queued_records:
                  attempt_number = previous_attempts + 1

                  print(
                      f"\nAnalysing {issue_key}, change record {record_id} "
                      f"(workflow attempt {attempt_number}/"
                      f"{MAX_DB_ATTEMPTS})"
                  )

                  # Record the attempt before the API call. If the runner
                  # stops unexpectedly, the attempt is still accounted for.
                  with connection.cursor() as cursor:
                      cursor.execute(
                          """
                          UPDATE jira_changes
                          SET attempt_count = COALESCE(attempt_count, 0) + 1,
                              last_error = NULL
                          WHERE id = %s
                          """,
                          (record_id,),
                      )
                  connection.commit()

                  try:
                      analysis = gemini_analyse(
                          issue_key,
                          next(
                              (
                                  item.get("fields", {}).get("summary")
                                  for item in issues
                                  if item.get("key") == issue_key
                              ),
                              "(Summary unavailable)",
                          ),
                          changed_at,
                          changed_fields,
                      )

                      with connection.cursor() as cursor:
                          cursor.execute(
                              """
                              UPDATE jira_changes
                              SET gemini_analysis = %s,
                                  status = 'completed',
                                  processed_at = NOW(),
                                  last_error = NULL
                              WHERE id = %s
                              """,
                              (analysis, record_id),
                          )
                      connection.commit()

                      analyses_performed += 1
                      print("  Gemini analysis saved to Neon.")
                      print("  Analysis preview:")
                      print("  " + analysis[:300].replace("\n", "\n  "))

                  except Exception as exc:
                      error_message = (
                          f"{type(exc).__name__}: {exc}"
                      )[:1000]

                      with connection.cursor() as cursor:
                          cursor.execute(
                              """
                              UPDATE jira_changes
                              SET status = 'failed',
                                  last_error = %s
                              WHERE id = %s
                              """,
                              (error_message, record_id),
                          )
                      connection.commit()

                      analyses_failed += 1
                      print(f"  Gemini analysis failed: {error_message}")

              connection.close()

          except Exception as exc:
              print(
                  "\nERROR: Workflow stopped: "
                  f"{type(exc).__name__}: {exc}"
              )
              sys.exit(1)

          print("\n" + "=" * 40)
          print("Change Tracking Summary")
          print("=" * 40)
          print(f"Change entries examined: {entries_examined}")
          print(f"New changes recorded: {new_changes}")
          print(f"Previously recorded changes skipped: {known_changes}")
          print(f"Older changelog entries outside the window: {older_changes}")
          print(f"Gemini analyses performed: {analyses_performed}")
          print(f"Gemini analyses failed: {analyses_failed}")
          print("=" * 40)

          if analyses_failed:
              print(
                  "Change tracking completed, but some Gemini analyses "
                  "failed. Failed records remain in Neon for a later retry."
              )
          else:
              print("Change tracking run completed successfully.")
          PYTHON
