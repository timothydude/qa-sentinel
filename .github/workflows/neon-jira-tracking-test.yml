
name: Neon Jira Change Tracking Test

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Look back this many hours for Jira changes"
        required: true
        default: "168"
        type: string

  push:
    branches:
      - test-gemini-api

permissions:
  contents: read

concurrency:
  group: neon-jira-change-tracking
  cancel-in-progress: false

jobs:
  track-jira-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      JIRA_URL: ${{ secrets.JIRA_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.8-flash
      LOOKBACK_HOURS: ${{ inputs.hours || '168' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL driver
        run: python -m pip install --disable-pip-version-check "psycopg[binary]"

      - name: Track Jira changes and analyse with Gemini
        run: |
          python3 - <<'PYTHON'
          import base64
          import json
          import os
          import socket
          import sys
          import time
          from datetime import datetime, timedelta, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          import psycopg
          from psycopg.types.json import Jsonb

          print("=" * 40)
          print("Neon Jira Change Tracking Test")
          print("=" * 40)

          JIRA_URL = os.environ["JIRA_URL"].rstrip("/")
          JIRA_EMAIL = os.environ["JIRA_EMAIL"]
          JIRA_API_TOKEN = os.environ["JIRA_API_TOKEN"]
          PROJECT_KEY = os.environ["JIRA_PROJECT_KEY"].strip()
          DATABASE_URL = os.environ["DATABASE_URL"]
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]
          GEMINI_MODEL = os.environ.get(
              "GEMINI_MODEL", "gemini-3.8-flash"
          )

          MAX_ISSUES = 10
          MAX_GEMINI_RECORDS = 5
          MAX_DB_ATTEMPTS = 3
          GEMINI_TIMEOUT = 30
          RETRY_DELAYS = [2, 5]

          try:
              HOURS = int(os.environ.get("LOOKBACK_HOURS", "168"))
          except ValueError:
              print("ERROR: Lookback hours must be a whole number.")
              sys.exit(1)

          required = {
              "JIRA_URL": JIRA_URL,
              "JIRA_EMAIL": JIRA_EMAIL,
              "JIRA_API_TOKEN": JIRA_API_TOKEN,
              "JIRA_PROJECT_KEY": PROJECT_KEY,
              "DATABASE_URL": DATABASE_URL,
              "GEMINI_API_KEY": GEMINI_API_KEY,
          }

          missing = [
              name for name, value in required.items() if not value
          ]

          if missing:
              print("ERROR: Missing configuration: " + ", ".join(missing))
              sys.exit(1)

          if HOURS < 1 or HOURS > 2160:
              print("ERROR: Hours must be between 1 and 2160.")
              sys.exit(1)

          cutoff = datetime.now(timezone.utc) - timedelta(hours=HOURS)

          print(f"Project: {PROJECT_KEY}")
          print(f"Lookback window: {HOURS} hours")
          print(f"Maximum issues to inspect: {MAX_ISSUES}")
          print(f"Gemini model: {GEMINI_MODEL}")
          print("Gemini calls: enabled")

          def jira_get_json(path, params=None):
              url = f"{JIRA_URL}{path}"

              if params:
                  url += "?" + urlencode(params)

              credentials = base64.b64encode(
                  f"{JIRA_EMAIL}:{JIRA_API_TOKEN}".encode()
              ).decode()

              request = Request(
                  url,
                  headers={
                      "Authorization": f"Basic {credentials}",
                      "Accept": "application/json",
                  },
                  method="GET",
              )

              with urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def parse_datetime(value):
              if not value:
                  return None

              result = datetime.fromisoformat(
                  value.replace("Z", "+00:00")
              )

              if result.tzinfo is None:
                  result = result.replace(tzinfo=timezone.utc)

              return result.astimezone(timezone.utc)

          def get_recent_issues():
              jql = (
                  f'project = "{PROJECT_KEY}" '
                  f"AND updated >= -{HOURS}h "
                  "ORDER BY updated DESC"
              )

              result = jira_get_json(
                  "/rest/api/3/search/jql",
                  {
                      "jql": jql,
                      "maxResults": MAX_ISSUES,
                      "fields": "summary,updated",
                  },
              )

              return result.get("issues", [])

          def get_issue_changelog(issue_key):
              histories = []
              start_at = 0
              page_size = 100

              while True:
                  result = jira_get_json(
                      f"/rest/api/3/issue/{issue_key}/changelog",
                      {
                          "startAt": start_at,
                          "maxResults": page_size,
                      },
                  )

                  page = result.get("values", [])
                  histories.extend(page)

                  if result.get("isLast", False) or not page:
                      break

                  start_at += len(page)
                  total = result.get("total")

                  if total is not None and start_at >= total:
                      break

              return histories

          def gemini_analyse(issue_key, summary, changed_at, changes):
              prompt = f"""
          You are a senior software QA analyst reviewing a specific
          Jira change. Your job is to help a tester understand what
          changed, what could be affected, and what should be tested.

          JIRA CONTEXT

          Issue key: {issue_key}
          Summary: {summary}
          Change timestamp (UTC): {changed_at.isoformat()}

          CHANGE DATA

          {json.dumps(changes, ensure_ascii=False, indent=2, default=str)}

          IMPORTANT CONTEXT LIMITATION

          You are reviewing the supplied changelog entry, not necessarily
          the complete Jira story, its current acceptance criteria, linked
          issues, or the full history of the requirement.

          The supplied data may contain only part of a description or
          requirement. A previous value or new value may also be missing.

          Do not assume that the supplied change data represents the
          entire story. Do not claim that acceptance criteria were added,
          removed, or contradicted unless the supplied evidence supports
          that conclusion.

          If additional story context is needed to confirm an issue,
          explicitly state what information is missing.

          ANALYSIS REQUIREMENTS

          ### 1. What Changed

          - Identify the field or fields that changed.
          - Explain the previous value and the new value accurately.
          - Focus on the actual difference rather than rewriting the
            entire requirement.
          - Identify whether the change appears to affect a requirement,
            acceptance criterion, validation rule, user interface,
            workflow, dependency, or administrative note.
          - If the significance is uncertain, say so.
          - Never describe a suspected change as a confirmed fact.

          ### 2. Potential Impact

          Assess potential effects on functionality, business rules,
          acceptance criteria, integrations, data, validation,
          error handling, and existing tests where relevant.

          For each material impact, distinguish between:

          - CONFIRMED: Directly supported by the supplied change data.
          - POTENTIAL: A reasonable risk that requires verification.
          - UNKNOWN: Cannot be assessed without additional information.

          Do not list unrelated technical risks merely to make the
          analysis appear comprehensive.

          ### 3. Acceptance Criteria and Inconsistencies

          Review the supplied change for evidence of:

          - Acceptance criteria that were added, changed, or removed.
          - Wording that could be interpreted in multiple ways.
          - Conflicting statements or business rules.
          - Missing expected behaviour or error handling.
          - Dependencies or references that are unclear.
          - Differences between the stated requirement and the
            change being made.

          For each concern, explain the exact wording or evidence
          that raises it and why clarification may be needed.

          Do not call something a contradiction merely because it
          is unfamiliar or because additional context is unavailable.

          If no concern is evident in the supplied data, say so.
          Make clear that this does not prove the entire Jira story
          is free of inconsistencies.

          ### 4. Regression Testing

          Recommend specific, actionable test scenarios relevant to
          this change. Prioritise scenarios that verify changed
          behaviour and protect existing behaviour from regression.

          For each scenario, provide:

          - Test ID: A short identifier such as TC-01.
          - Priority: High, Medium, or Low, with a brief reason.
          - Test objective: What the test is intended to verify.
          - Preconditions or test data: What must be set up.
          - Steps: The actions a tester should perform.
          - Expected result: The observable outcome that should occur.
          - Evidence basis: Whether the scenario is directly supported
            by the change or is a potential risk that needs confirmation.

          Include positive and negative cases when relevant.
          Consider boundary conditions, validation failures, state
          transitions, and existing functionality where appropriate.

          Do not invent exact UI labels, APIs, data values, business
          rules, or expected results that are not supported by the
          supplied information. If an expected result is unknown,
          identify it as requiring confirmation.

          Avoid generic recommendations such as "perform regression
          testing" without specifying what to test and what to verify.

          Prefer a small set of high-value scenarios over a long list
          of repetitive or speculative tests.

          ### 5. Questions and Recommended Actions

          Provide prioritised follow-up actions for QA, the developer,
          product owner, or business analyst as appropriate.

          For each action:

          - State the question or action clearly.
          - Explain why it matters.
          - Identify the appropriate owner where reasonably clear.
          - Explain whether it blocks test design, execution, or sign-off.

          Ask only questions that resolve a real uncertainty in the
          supplied evidence. Do not ask questions already answered
          by the change data.

          Separate essential clarifications from optional improvements.
          Do not invent people, documents, issue keys, or dependencies.

          OVERALL RULES

          - Complete all five sections.
          - Use concise, professional language suitable for a QA team.
          - Use the supplied previous and new values as the primary
            evidence for describing the change.
          - Separate confirmed facts from hypotheses and unknowns.
          - Never claim that a defect exists without evidence.
          - Never invent requirements or expected behaviour.
          - Do not treat informal comments as formal acceptance criteria
            unless the evidence supports that interpretation.
          - Do not repeat the same finding in multiple sections unless
            necessary to explain its testing implications.
          - Finish every sentence, list item, and test scenario.
          - If the supplied information is insufficient, explain
            precisely what can and cannot be concluded.
          - Return the analysis only, using the five headings above.
          """.strip()

              url = (
                  "https://generativelanguage.googleapis.com/v1beta/"
                  f"models/{GEMINI_MODEL}:generateContent"
              )

              payload = {
                  "contents": [
                      {"parts": [{"text": prompt}]}
                  ],
                  "generationConfig": {
                      "maxOutputTokens": 4000
                  },
              }

              body = json.dumps(payload).encode("utf-8")
              last_error = None

              for attempt in range(1, 4):
                  request = Request(
                      url,
                      data=body,
                      headers={
                          "Content-Type": "application/json",
                          "x-goog-api-key": GEMINI_API_KEY,
                      },
                      method="POST",
                  )

                  try:
                      with urlopen(
                          request, timeout=GEMINI_TIMEOUT
                      ) as response:
                          result = json.loads(
                              response.read().decode("utf-8")
                          )

                      candidates = result.get("candidates", [])

                      if not candidates:
                          raise RuntimeError(
                              "Gemini returned no response candidates."
                          )

                      candidate = candidates[0]
                      finish_reason = candidate.get("finishReason")

                      print(
                          "  Gemini finish reason: "
                          f"{finish_reason or 'not supplied'}"
                      )

                      usage = result.get("usageMetadata", {})
                      output_tokens = usage.get("candidatesTokenCount")

                      if output_tokens is not None:
                          print(
                              f"  Gemini output tokens: {output_tokens}"
                          )

                      if finish_reason == "MAX_TOKENS":
                          raise RuntimeError(
                              "Gemini reached its output-token limit. "
                              "The incomplete response will not be saved "
                              "as a completed analysis."
                          )

                      if finish_reason != "STOP":
                          raise RuntimeError(
                              "Gemini did not report a normal completion. "
                              f"Finish reason: {finish_reason or 'missing'}"
                          )

                      parts = candidate.get(
                          "content", {}
                      ).get("parts", [])

                      answer = "\n".join(
                          part.get("text", "")
                          for part in parts
                          if part.get("text")
                      ).strip()

                      if not answer:
                          raise RuntimeError(
                              "Gemini returned no analysis text."
                          )

                      return answer

                  except HTTPError as exc:
                      last_error = RuntimeError(
                          f"Gemini API returned HTTP {exc.code}"
                      )

                      if exc.code not in (
                          408, 429, 500, 502, 503, 504
                      ):
                          raise last_error from exc

                  except (URLError, TimeoutError, socket.timeout) as exc:
                      last_error = RuntimeError(
                          "Gemini network error: "
                          f"{type(exc).__name__}"
                      )

                  if attempt < 3:
                      delay = RETRY_DELAYS[attempt - 1]
                      print(
                          f"  Temporary Gemini error on network "
                          f"attempt {attempt}/3. Retrying in "
                          f"{delay} seconds."
                      )
                      time.sleep(delay)

              raise last_error or RuntimeError(
                  "Gemini failed after all network attempts."
              )

          connection = None

          new_changes = 0
          known_changes = 0
          older_changes = 0
          entries_examined = 0
          analyses_performed = 0
          analyses_failed = 0

          try:
              # Autocommit prevents one failed SQL statement from leaving
              # a transaction aborted for later statements.
              connection = psycopg.connect(
                  DATABASE_URL,
                  autocommit=True,
              )

              issues = get_recent_issues()
              issue_summaries = {
                  issue["key"]: issue.get("fields", {}).get(
                      "summary", "(No summary)"
                  )
                  for issue in issues
              }

              print(
                  f"Recently updated issues found: {len(issues)}"
              )

              for issue in issues:
                  issue_key = issue["key"]
                  summary = issue_summaries[issue_key]

                  print(f"\nInspecting {issue_key}: {summary}")

                  histories = get_issue_changelog(issue_key)
                  issue_new = 0

                  for history in histories:
                      changed_at = parse_datetime(
                          history.get("created")
                      )

                      if changed_at is None:
                          continue

                      if changed_at < cutoff:
                          older_changes += 1
                          continue

                      entries_examined += 1
                      changed_fields = []

                      for item in history.get("items", []):
                          changed_fields.append({
                              "field": item.get("field"),
                              "field_type": item.get("fieldtype"),
                              "from": item.get("fromString"),
                              "to": item.get("toString"),
                          })

                      if not changed_fields:
                          continue

                      with connection.cursor() as cursor:
                          cursor.execute(
                              """
                              INSERT INTO jira_changes (
                                  issue_key,
                                  changelog_id,
                                  changed_at,
                                  changed_fields,
                                  status,
                                  attempt_count,
                                  discovered_at
                              )
                              VALUES (
                                  %s, %s, %s, %s, 'pending', 0, NOW()
                              )
                              ON CONFLICT (issue_key, changelog_id)
                              DO NOTHING
                              """,
                              (
                                  issue_key,
                                  str(history["id"]),
                                  changed_at,
                                  Jsonb(changed_fields),
                              ),
                          )

                          if cursor.rowcount == 1:
                              new_changes += 1
                              issue_new += 1
                          else:
                              known_changes += 1

                  print(f"  Newly recorded changes: {issue_new}")

              # Select eligible records in a short, independent query.
              with connection.cursor() as cursor:
                  cursor.execute(
                      """
                      SELECT
                          id,
                          issue_key,
                          changelog_id,
                          changed_at,
                          changed_fields,
                          COALESCE(attempt_count, 0)
                      FROM jira_changes
                      WHERE status IN ('pending', 'failed')
                        AND COALESCE(attempt_count, 0) < %s
                      ORDER BY changed_at ASC, id ASC
                      LIMIT %s
                      """,
                      (MAX_DB_ATTEMPTS, MAX_GEMINI_RECORDS),
                  )
                  queued_records = cursor.fetchall()

              print(
                  "\nEligible changes queued for Gemini: "
                  f"{len(queued_records)}"
              )

              for (
                  record_id,
                  issue_key,
                  changelog_id,
                  changed_at,
                  changed_fields,
                  previous_attempts,
              ) in queued_records:
                  attempt_number = previous_attempts + 1

                  print(
                      f"\nAnalysing {issue_key}, change record "
                      f"{record_id} (workflow attempt "
                      f"{attempt_number}/{MAX_DB_ATTEMPTS})"
                  )

                  # Record the attempt in its own autocommitted statement.
                  with connection.cursor() as cursor:
                      cursor.execute(
                          """
                          UPDATE jira_changes
                          SET attempt_count =
                                  COALESCE(attempt_count, 0) + 1,
                              last_error = NULL
                          WHERE id = %s
                          """,
                          (record_id,),
                      )

                  try:
                      analysis = gemini_analyse(
                          issue_key,
                          issue_summaries.get(
                              issue_key, "(Summary unavailable)"
                          ),
                          changed_at,
                          changed_fields,
                      )

                      with connection.cursor() as cursor:
                          cursor.execute(
                              """
                              UPDATE jira_changes
                              SET gemini_analysis = %s,
                                  status = 'completed',
                                  processed_at = NOW(),
                                  last_error = NULL
                              WHERE id = %s
                              """,
                              (analysis, record_id),
                          )

                      analyses_performed += 1
                      print("  Gemini analysis saved to Neon.")
                      print("  Analysis preview:")
                      print(
                          "  "
                          + analysis[:300].replace("\n", "\n  ")
                      )

                  except Exception as exc:
                      error_message = (
                          f"{type(exc).__name__}: {exc}"
                      )[:1000]

                      # Persist the error separately from the failed API call.
                      try:
                          with connection.cursor() as cursor:
                              cursor.execute(
                                  """
                                  UPDATE jira_changes
                                  SET status = 'failed',
                                      last_error = %s
                                  WHERE id = %s
                                  """,
                                  (error_message, record_id),
                              )

                          analyses_failed += 1
                          print(
                              "  Gemini analysis failed: "
                              f"{error_message}"
                          )

                      except Exception as db_exc:
                          print(
                              "  ERROR saving failure status for record "
                              f"{record_id}: {type(db_exc).__name__}: "
                              f"{db_exc}"
                          )
                          raise

              print("\n" + "=" * 40)
              print("Change Tracking Summary")
              print("=" * 40)
              print(f"Change entries examined: {entries_examined}")
              print(f"New changes recorded: {new_changes}")
              print(
                  "Previously recorded changes skipped: "
                  f"{known_changes}"
              )
              print(
                  "Older changelog entries outside the window: "
                  f"{older_changes}"
              )
              print(f"Gemini analyses performed: {analyses_performed}")
              print(f"Gemini analyses failed: {analyses_failed}")
              print("=" * 40)

              if analyses_failed:
                  print(
                      "Change tracking completed, but some Gemini "
                      "analyses failed. Eligible failed records can "
                      "be retried on a later run."
                  )
              else:
                  print("Change tracking run completed successfully.")

          except Exception as exc:
              print(
                  "\nERROR: Workflow stopped: "
                  f"{type(exc).__name__}: {exc}"
              )
              sys.exit(1)

          finally:
              if connection is not None and not connection.closed:
                  connection.close()

          PYTHON
