name: QA Sentinel Batch Analysis Test

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Look back this many hours"
        required: true
        default: "24"
        type: string

jobs:
  batch-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scan Jira and analyse relevant changes
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}
          HOURS: ${{ inputs.hours }}
        run: |
          python3 - <<'PYTHON'
          import os
          import json
          import time
          import base64
          import urllib.request
          import urllib.error
          from urllib.parse import quote
          from datetime import datetime, timedelta, timezone

          JIRA_URL = os.environ["JIRA_URL"].rstrip("/")
          JIRA_EMAIL = os.environ["JIRA_EMAIL"]
          JIRA_TOKEN = os.environ["JIRA_API_TOKEN"]
          GEMINI_KEY = os.environ["GEMINI_API_KEY"]
          PROJECT = os.environ["JIRA_PROJECT_KEY"].strip()
          HOURS = int(os.environ.get("HOURS", "24"))

          if not PROJECT:
              raise SystemExit("JIRA_PROJECT_KEY is empty.")

          if HOURS < 1 or HOURS > 168:
              raise SystemExit("Hours must be between 1 and 168.")

          credentials = base64.b64encode(
              f"{JIRA_EMAIL}:{JIRA_TOKEN}".encode()
          ).decode()

          jira_headers = {
              "Authorization": f"Basic {credentials}",
              "Accept": "application/json",
              "Content-Type": "application/json"
          }

          def get_json(url):
              request = urllib.request.Request(
                  url, headers=jira_headers
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def post_json(url, payload):
              request = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers=jira_headers,
                  method="POST"
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def to_text(value):
              if value is None:
                  return ""

              if isinstance(value, str):
                  try:
                      parsed = json.loads(value)
                      if isinstance(parsed, dict):
                          value = parsed
                      else:
                          return value
                  except (ValueError, TypeError):
                      return value

              if isinstance(value, list):
                  return "\n".join(
                      text for item in value
                      if (text := to_text(item))
                  )

              if isinstance(value, dict):
                  if value.get("type") == "text":
                      return value.get("text", "")

                  parts = [
                      to_text(item)
                      for item in value.get("content", [])
                  ]
                  return "".join(parts)

              return str(value)

          def parse_date(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  ).astimezone(timezone.utc)
              except (ValueError, TypeError):
                  return None

          # Include fields likely to affect requirements or testing.
          # Custom fields are included only when their names suggest
          # requirements, acceptance criteria, or expected behaviour.
          def is_relevant_field(item):
              name = (
                  item.get("field") or item.get("fieldId") or ""
              ).strip().lower()

              exact_fields = {
                  "summary",
                  "description",
                  "environment",
                  "labels",
                  "priority",
                  "components",
                  "fix versions",
                  "fix version",
                  "versions",
                  "version",
                  "issuetype",
                  "issue type"
              }

              if name in exact_fields:
                  return True

              keywords = (
                  "acceptance",
                  "requirement",
                  "expected behaviour",
                  "expected behavior",
                  "business rule",
                  "specification",
                  "criteria"
              )

              return any(word in name for word in keywords)

          def jira_changelog(issue_key):
              url = (
                  f"{JIRA_URL}/rest/api/3/issue/"
                  f"{quote(issue_key)}/changelog"
              )

              histories = []
              start_at = 0

              while True:
                  page_url = (
                      f"{url}?startAt={start_at}&maxResults=100"
                  )
                  page = get_json(page_url)
                  values = page.get("values", [])
                  histories.extend(values)

                  if page.get("isLast", False) or not values:
                      break

                  start_at += len(values)

                  if start_at >= page.get("total", start_at):
                      break

              return histories

          cutoff = datetime.now(timezone.utc) - timedelta(hours=HOURS)

          print("=" * 44)
          print("QA Sentinel Batch Analysis Test")
          print("=" * 44)
          print(f"Project: {PROJECT}")
          print(f"Lookback window: {HOURS} hours")
          print("Maximum issues to inspect: 10")
          print("Maximum Gemini analyses: 5")
          print()

          # Step 1: Find recently updated issues.
          jql = (
              f'project = "{PROJECT}" '
              f'AND updated >= -{HOURS}h '
              "ORDER BY updated DESC"
          )

          search_url = f"{JIRA_URL}/rest/api/3/search/jql"

          search_result = post_json(
              search_url,
              {
                  "jql": jql,
                  "maxResults": 10,
                  "fields": ["summary", "updated"]
              }
          )

          issues = search_result.get("issues", [])

          print(f"Recently updated issues found: {len(issues)}")
          print()

          # Step 2: Inspect actual changelog entries.
          candidates = []

          for issue in issues:
              key = issue["key"]
              fields = issue.get("fields", {})
              summary = fields.get("summary", "(no summary)")

              print(f"Inspecting {key}: {summary}")

              try:
                  histories = jira_changelog(key)
              except Exception as error:
                  print(
                      f"  Could not retrieve changelog: "
                      f"{type(error).__name__}: {error}"
                  )
                  continue

              changes = []

              for history in histories:
                  created = parse_date(history.get("created"))

                  if created is None or created < cutoff:
                      continue

                  for item in history.get("items", []):
                      if not is_relevant_field(item):
                          continue

                      before = to_text(item.get("fromString"))
                      after = to_text(item.get("toString"))

                      if before == after:
                          continue

                      changes.append({
                          "date": history.get("created", "Unknown"),
                          "author": (
                              history.get("author", {}).get("displayName")
                              or "Unknown"
                          ),
                          "field": (
                              item.get("field")
                              or item.get("fieldId")
                              or "Unknown"
                          ),
                          "before": before,
                          "after": after
                      })

              if changes:
                  candidates.append({
                      "key": key,
                      "summary": summary,
                      "changes": changes
                  })
                  print(f"  Relevant changes found: {len(changes)}")
              else:
                  print("  No matching changes in the time window.")

          print()
          print(f"Issues with relevant changes: {len(candidates)}")

          # Step 3: Limit Gemini usage.
          selected = candidates[:5]

          if len(candidates) > len(selected):
              print(
                  f"Only the first {len(selected)} issues will be "
                  "sent to Gemini in this run."
              )

          if not selected:
              print()
              print("No matching changes to analyse.")
              print("No Gemini API calls were made.")
              print("=" * 44)
              print("Batch scan completed.")
              print("=" * 44)
              raise SystemExit(0)

          # Step 4: Analyse each selected issue.
          for number, issue in enumerate(selected, start=1):
              change_text = []

              for change in issue["changes"]:
                  change_text.append(
                      f"Date: {change['date']}\n"
                      f"Author: {change['author']}\n"
                      f"Field: {change['field']}\n"
                      f"BEFORE:\n{change['before'] or '(empty)'}\n"
                      f"AFTER:\n{change['after'] or '(empty)'}"
                  )

              prompt = f"""
          You are QA Sentinel, an assistant for software testers.

          Analyse these actual Jira changelog entries.

          Issue: {issue['key']} - {issue['summary']}

          CHANGES:
          {chr(10).join(change_text)}

          Explain:
          1. What changed?
          2. What is the likely QA impact?
          3. What should a tester verify or clarify?

          Separate confirmed changes from assumptions.
          Do not invent missing requirements.
          If the change appears administrative or has no clear
          functional impact, say so.
          Keep the answer concise and practical.
          """

              payload = {
                  "contents": [{
                      "parts": [{"text": prompt}]
                  }]
              }

              gemini_url = (
                  "https://generativelanguage.googleapis.com/v1beta/"
                  "models/gemini-3.8-flash:generateContent"
                  f"?key={GEMINI_KEY}"
              )

              request = urllib.request.Request(
                  gemini_url,
                  data=json.dumps(payload).encode(),
                  headers={"Content-Type": "application/json"},
                  method="POST"
              )

              print()
              print("=" * 44)
              print(f"Gemini analysis {number}/{len(selected)}")
              print(f"Issue: {issue['key']} - {issue['summary']}")
              print("=" * 44)

              try:
                  start = time.time()

                  with urllib.request.urlopen(
                      request, timeout=60
                  ) as response:
                      result = json.load(response)
                      print(f"Gemini HTTP status: {response.status}")

                  answer = (
                      result["candidates"][0]
                      ["content"]["parts"][0]["text"]
                  )

                  print(f"Response time: {time.time() - start:.2f}s")
                  print()
                  print(answer)

              except Exception as error:
                  print(
                      f"Gemini analysis failed for {issue['key']}: "
                      f"{type(error).__name__}: {error}"
                  )
                  # Continue so one failure doesn't stop other issues.

          print()
          print("=" * 44)
          print("Batch analysis finished.")
          print("=" * 44)
          PYTHON
