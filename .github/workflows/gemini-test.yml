name: Gemini Live Jira Analysis Test

on:
  workflow_dispatch:

jobs:
  jira-gemini-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Retrieve Jira change and analyse with Gemini
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import os
          import json
          import time
          import base64
          import urllib.request
          import urllib.error
          from urllib.parse import quote

          # Configuration
          ISSUE_KEY = "KAN-175"

          JIRA_URL = os.environ["JIRA_URL"].rstrip("/")
          JIRA_EMAIL = os.environ["JIRA_EMAIL"]
          JIRA_API_TOKEN = os.environ["JIRA_API_TOKEN"]
          GEMINI_API_KEY = os.environ["GEMINI_API_KEY"]

          # Jira authentication
          credentials = base64.b64encode(
              f"{JIRA_EMAIL}:{JIRA_API_TOKEN}".encode()
          ).decode()

          jira_headers = {
              "Authorization": f"Basic {credentials}",
              "Accept": "application/json"
          }

          def jira_get(url):
              request = urllib.request.Request(
                  url,
                  headers=jira_headers
              )
              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:
                  return json.load(response)

          def to_text(value):
              """Convert Jira text or Atlassian Document Format to readable text."""
              if value is None:
                  return ""

              if isinstance(value, str):
                  try:
                      parsed = json.loads(value)
                      if isinstance(parsed, dict):
                          value = parsed
                  except (ValueError, TypeError):
                      return value

              if isinstance(value, list):
                  return "\n".join(
                      text for item in value
                      if (text := to_text(item))
                  )

              if isinstance(value, dict):
                  if value.get("type") == "text":
                      return value.get("text", "")

                  parts = []
                  for item in value.get("content", []):
                      text = to_text(item)
                      if text:
                          parts.append(text)

                  if value.get("type") in ("paragraph", "heading"):
                      return "".join(parts) + "\n"

                  return "".join(parts)

              return str(value)

          print("========================================")
          print("Live Jira + Gemini Test")
          print("========================================")
          print(f"Issue: {ISSUE_KEY}")
          print()

          # Step 1: Retrieve issue details
          issue_url = (
              f"{JIRA_URL}/rest/api/3/issue/"
              f"{quote(ISSUE_KEY)}?fields=summary"
          )

          issue = jira_get(issue_url)
          summary = issue["fields"]["summary"]

          print(f"Retrieved Jira issue: {ISSUE_KEY}")
          print(f"Summary: {summary}")
          print()

          # Step 2: Retrieve the complete changelog in pages
          changelog_url = (
              f"{JIRA_URL}/rest/api/3/issue/"
              f"{quote(ISSUE_KEY)}/changelog"
          )

          histories = []
          start_at = 0

          while True:
              separator = "&" if "?" in changelog_url else "?"
              page_url = (
                  f"{changelog_url}{separator}"
                  f"startAt={start_at}&maxResults=100"
              )

              page = jira_get(page_url)
              values = page.get("values", [])
              histories.extend(values)

              if page.get("isLast", False):
                  break

              if not values:
                  break

              start_at += len(values)

              if start_at >= page.get("total", start_at):
                  break

          # Step 3: Find the most recent description change
          description_changes = []

          for history in histories:
              for item in history.get("items", []):
                  field_name = (
                      item.get("fieldId") or item.get("field") or ""
                  ).lower()

                  if field_name == "description":
                      before = to_text(item.get("fromString"))
                      after = to_text(item.get("toString"))

                      if before != after:
                          description_changes.append({
                              "date": history.get("created", "Unknown"),
                              "author": (
                                  history.get("author", {}).get("displayName")
                                  or "Unknown"
                              ),
                              "before": before,
                              "after": after
                          })

          if not description_changes:
              print(
                  "No description change with readable before/after "
                  "values was found in this issue's changelog."
              )
              print(
                  "The workflow will stop rather than invent a change."
              )
              raise SystemExit(1)

          change = max(
              description_changes,
              key=lambda entry: entry["date"]
          )

          print("Latest description change retrieved from Jira:")
          print(f"Date: {change['date']}")
          print(f"Author: {change['author']}")
          print()
          print("BEFORE:")
          print(change["before"] or "(empty)")
          print()
          print("AFTER:")
          print(change["after"] or "(empty)")
          print()

          # Step 4: Send the actual Jira change to Gemini
          prompt = f"""
          You are QA Sentinel, an AI assistant for software testers.

          Analyse this actual Jira description change.

          Issue: {ISSUE_KEY} - {summary}
          Change date: {change['date']}

          BEFORE:
          {change['before'] or '(empty)'}

          AFTER:
          {change['after'] or '(empty)'}

          Explain:
          1. What appears to have changed?
          2. What is the likely QA impact?
          3. What should a tester verify or clarify?

          Be concise and practical.
          Distinguish confirmed facts from assumptions.
          Do not invent missing requirements. If the text is ambiguous,
          explicitly say what needs clarification.
          """

          gemini_url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.8-flash:generateContent"
              f"?key={GEMINI_API_KEY}"
          )

          payload = {
              "contents": [{
                  "parts": [{"text": prompt}]
              }]
          }

          request = urllib.request.Request(
              gemini_url,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          print("Sending the retrieved Jira change to Gemini...")
          print("Timeout: 60 seconds")
          print()

          start_time = time.time()

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:
                  result = json.load(response)
                  print(f"Gemini HTTP status: {response.status}")

              answer = (
                  result["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )

              print()
              print("========================================")
              print("Gemini QA Analysis")
              print("========================================")
              print(answer)
              print()
              print("========================================")
              print("Live Jira + Gemini test completed.")
              print("========================================")

          except urllib.error.HTTPError as error:
              print(f"Gemini HTTP error: {error.code}")
              print(error.read().decode(errors="replace"))
              raise SystemExit(1)

          except Exception as error:
              print(f"Error type: {type(error).__name__}")
              print(f"Error: {error}")
              raise SystemExit(1)
          PYTHON
