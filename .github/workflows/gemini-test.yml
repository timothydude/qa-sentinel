name: Gemini Real Jira Change Test

on:
  workflow_dispatch:

jobs:
  gemini-test:
    runs-on: ubuntu-latest

    steps:
      - name: Send Real Jira Change to Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GEMINI_API_KEY"]

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.8-flash:generateContent"
              f"?key={API_KEY}"
          )

          prompt = """
          You are QA Sentinel, an AI assistant for software testers.

          Analyse the following real Jira change from a QA perspective.

          Jira Issue:
          KAN-175 - Choose account type and enter contact details

          Field changed:
          Description

          BEFORE:
          It has been agreed that the last point is no longer relevant.
          Please inform Jones to update the document.

          AFTER:
          It has now been agreed that it is relevant.
          Please inform Jones to update the document.

          Please provide:

          1. What changed in the requirement or expected behaviour?
          2. What is the likely QA impact?
          3. What should a tester verify?

          Keep the answer concise and practical.
          Do not invent information that is not supported by the change.
          """

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ]
          }

          data = json.dumps(payload).encode()

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("========================================")
          print("Gemini Real Jira Change Test")
          print("========================================")
          print()
          print("Sending real Jira change to Gemini...")
          print("Issue: KAN-175")
          print("Model: gemini-3.8-flash")
          print("Timeout: 60 seconds")
          print()

          start_time = time.time()

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  elapsed = time.time() - start_time

                  print(f"HTTP status: {response.status}")
                  print(f"Response time: {elapsed:.2f} seconds")
                  print()

                  result = json.load(response)

              answer = (
                  result["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )

              print("========================================")
              print("Gemini QA Analysis")
              print("========================================")
              print()
              print(answer)
              print()
              print("========================================")
              print("Gemini QA analysis completed.")
              print("========================================")

          except urllib.error.HTTPError as e:

              elapsed = time.time() - start_time

              print("Gemini API returned an HTTP error.")
              print(f"HTTP status: {e.code}")
              print(f"Response time: {elapsed:.2f} seconds")
              print()

              body = e.read().decode(errors="replace")
              print("Gemini response:")
              print(body)

              raise SystemExit(1)

          except Exception as e:

              elapsed = time.time() - start_time

              print("Gemini request failed.")
              print(f"Response time: {elapsed:.2f} seconds")
              print(f"ERROR TYPE: {type(e).__name__}")
              print(f"ERROR: {e}")

              raise SystemExit(1)
          PYTHON
