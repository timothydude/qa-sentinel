name: Gemini QA Analysis Test

on:
  workflow_dispatch:

jobs:
  gemini-test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Gemini QA Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GEMINI_API_KEY"]

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.8-flash:generateContent"
              f"?key={API_KEY}"
          )

          prompt = """
          You are QA Sentinel.

          A Jira acceptance criterion changed from:

          "The customer must provide a phone number."

          to:

          "The customer no longer needs to provide a phone number."

          In one or two sentences, explain what this change means for QA.
          """

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ]
          }

          data = json.dumps(payload).encode()

          request = urllib.request.Request(
              url,
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)

              answer = (
                  result["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )

              print("========================================")
              print("Gemini QA Analysis Test")
              print("========================================")
              print()
              print("Response from Gemini:")
              print(answer)
              print()
              print("========================================")
              print("Gemini QA analysis completed.")
              print("========================================")

          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")

              print("Gemini API returned an error.")
              print(f"HTTP status: {e.code}")
              print(body)

              raise SystemExit(1)

          except Exception as e:
              print(f"ERROR: {e}")
              raise SystemExit(1)
          PYTHON
