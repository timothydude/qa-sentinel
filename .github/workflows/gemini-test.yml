name: Gemini QA Analysis Test

on:
  workflow_dispatch:

jobs:
  gemini-test:
    runs-on: ubuntu-latest

    steps:
      - name: Test Gemini QA Analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          API_KEY = os.environ["GEMINI_API_KEY"]

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.8-flash:generateContent"
              f"?key={API_KEY}"
          )

          prompt = """
          You are QA Sentinel.

          A Jira acceptance criterion changed from:

          "The customer must provide a phone number."

          to:

          "The customer no longer needs to provide a phone number."

          In one or two sentences, explain what this change means for QA.
          """

          payload = {
              "contents": [
                  {
                      "parts": [
                          {
                              "text": prompt
                          }
                      ]
                  }
              ]
          }

          data = json.dumps(payload).encode()

          request = urllib.request.Request(
              url,
              data=data,
              headers={
                  "Content-Type": "application/json"
              },
              method="POST"
          )

          print("========================================")
          print("Gemini QA Analysis Test")
          print("========================================")
          print()
          print("Testing Gemini API...")
          print("Model: gemini-3.8-flash")
          print("API: generateContent")
          print("Timeout: 60 seconds")
          print()

          start_time = time.time()

          try:
              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  elapsed = time.time() - start_time

                  print(f"HTTP status: {response.status}")
                  print(f"Response time: {elapsed:.2f} seconds")
                  print()

                  result = json.load(response)

              answer = (
                  result["candidates"][0]
                  ["content"]["parts"][0]["text"]
              )

              print("Response from Gemini:")
              print(answer)
              print()
              print("========================================")
              print("Gemini QA analysis completed.")
              print("========================================")

          except urllib.error.HTTPError as e:

              elapsed = time.time() - start_time

              print("Gemini API returned an HTTP error.")
              print(f"HTTP status: {e.code}")
              print(f"Response time: {elapsed:.2f} seconds")
              print()

              body = e.read().decode(errors="replace")
              print("Gemini response:")
              print(body)

              raise SystemExit(1)

          except Exception as e:

              elapsed = time.time() - start_time

              print("Gemini request failed.")
              print(f"Response time: {elapsed:.2f} seconds")
              print(f"ERROR TYPE: {type(e).__name__}")
              print(f"ERROR: {e}")

              raise SystemExit(1)
          PYTHON
