name: QA Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

jobs:
  qa-sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Find recently updated Jira issues and detect actual changes
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}

        run: |
          echo "========================================"
          echo "QA Sentinel"
          echo "========================================"
          echo ""
          echo "Checking Jira for recently updated issues..."
          echo ""

          JQL="project = $JIRA_PROJECT_KEY AND updated >= -1d ORDER BY updated DESC"

          RESPONSE=$(curl -s \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -G \
            -H "Accept: application/json" \
            --data-urlencode "jql=$JQL" \
            --data-urlencode "maxResults=50" \
            --data-urlencode "fields=summary,description,updated" \
            "$JIRA_URL/rest/api/3/search/jql")

          ISSUE_COUNT=$(echo "$RESPONSE" | jq '.issues | length')

          echo "Found $ISSUE_COUNT recently updated issue(s)."
          echo ""

          if [ "$ISSUE_COUNT" -eq 0 ]; then
            echo "No recently updated Jira issues found."
            exit 0
          fi

          echo "========================================"
          echo "Recently Updated Issues"
          echo "========================================"

          echo "$RESPONSE" | jq -r '
            .issues[] |
            "\(.key) - \(.fields.summary)\nUpdated: \(.fields.updated)\n"
          '

          echo ""
          echo "========================================"
          echo "QA Change Detection"
          echo "========================================"

          TODAY=$(date -u +"%Y-%m-%d")

          echo "Checking changes made on: $TODAY"
          echo ""

          echo "$RESPONSE" | jq -r '.issues[] | [.key, .fields.summary] | @tsv' |
          while IFS=$'\t' read -r ISSUE_KEY ISSUE_SUMMARY; do

            echo ""
            echo "----------------------------------------"
            echo "Issue: $ISSUE_KEY"
            echo "Summary: $ISSUE_SUMMARY"
            echo "----------------------------------------"

            CHANGELOG=$(curl -s \
              -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
              -G \
              -H "Accept: application/json" \
              --data-urlencode "maxResults=100" \
              "$JIRA_URL/rest/api/3/issue/$ISSUE_KEY/changelog")

            TODAY_CHANGES=$(echo "$CHANGELOG" | jq -c --arg TODAY "$TODAY" '
              .values[]
              | select((.created // "") | startswith($TODAY))
              | {
                  created: .created,
                  author: (.author.displayName // "Unknown"),
                  items: [
                    .items[]
                    | select(
                        .field == "summary" or
                        .field == "description" or
                        (.field | ascii_downcase | contains("acceptance")) or
                        .field == "priority" or
                        .field == "status" or
                        .field == "assignee" or
                        .field == "labels" or
                        .field == "components" or
                        (.field | ascii_downcase | contains("fix version"))
                      )
                  ]
                }
              | select(.items | length > 0)
            ')

            CHANGE_COUNT=$(echo "$TODAY_CHANGES" | grep -c . || true)

            if [ "$CHANGE_COUNT" -eq 0 ]; then
              echo "No QA-relevant changes found today."
              continue
            fi

            echo "$TODAY_CHANGES" |
            while IFS= read -r CHANGE_ENTRY; do

              export CHANGE_ENTRY

              python3 <<'PYTHON'
import os
import json
import difflib

change = json.loads(os.environ["CHANGE_ENTRY"])

created = change.get("created", "Unknown")
author = change.get("author", "Unknown")

for item in change.get("items", []):

    field = item.get("field", "Unknown")
    before = item.get("fromString") or ""
    after = item.get("toString") or ""

    # Split into lines while preserving meaningful blank lines
    before_lines = before.splitlines()
    after_lines = after.splitlines()

    matcher = difflib.SequenceMatcher(
        None,
        before_lines,
        after_lines
    )

    added = []
    removed = []
    changed_before = []
    changed_after = []

    for tag, i1, i2, j1, j2 in matcher.get_opcodes():

        if tag == "delete":
            removed.extend(before_lines[i1:i2])

        elif tag == "insert":
            added.extend(after_lines[j1:j2])

        elif tag == "replace":
            changed_before.extend(before_lines[i1:i2])
            changed_after.extend(after_lines[j1:j2])

    print("")
    print("========================================")
    print("QA Change Detected")
    print("========================================")
    print("")
    print(f"Changed:    {created}")
    print(f"Changed by: {author}")
    print(f"Field:      {field}")
    print("")

    has_change = False

    # Modified text
    if changed_before or changed_after:
        has_change = True

        print("----------------------------------------")
        print("CHANGED")
        print("----------------------------------------")
        print("")
        print("BEFORE:")
        for line in changed_before:
            print(f"- {line}")

        print("")
        print("AFTER:")
        for line in changed_after:
            print(f"+ {line}")

        print("")

    # Removed text
    if removed:
        has_change = True

        print("----------------------------------------")
        print("REMOVED")
        print("----------------------------------------")
        print("")

        for line in removed:
            print(f"- {line}")

        print("")

    # Added text
    if added:
        has_change = True

        print("----------------------------------------")
        print("ADDED")
        print("----------------------------------------")
        print("")

        for line in added:
            print(f"+ {line}")

        print("")

    # Handle fields where Jira reports a change but
    # the line-based comparison found nothing unusual.
    if not has_change and before != after:
        print("----------------------------------------")
        print("VALUE CHANGED")
        print("----------------------------------------")
        print("")
        print("BEFORE:")
        print(before)
        print("")
        print("AFTER:")
        print(after)
        print("")

PYTHON

            done

          done

          echo ""
          echo "========================================"
          echo "QA Sentinel completed"
          echo "========================================"