name: QA Sentinel

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

jobs:
  qa-sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Find recently updated Jira issues
        env:
          JIRA_URL: ${{ secrets.JIRA_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT_KEY: ${{ vars.JIRA_PROJECT_KEY }}

        run: |
          echo "Checking Jira for recently updated issues..."

          JQL="project = $JIRA_PROJECT_KEY AND updated >= -1d ORDER BY updated DESC"

          RESPONSE=$(curl -s \
            -u "$JIRA_EMAIL:$JIRA_API_TOKEN" \
            -G \
            -H "Accept: application/json" \
            --data-urlencode "jql=$JQL" \
            --data-urlencode "maxResults=50" \
            --data-urlencode "fields=summary,description,updated" \
            "$JIRA_URL/rest/api/3/search/jql")

          echo ""
          echo "Recently updated Jira issues:"
          echo ""

          echo "$RESPONSE" | jq -r '
            .issues[] |

            "========================================",
            "\(.key) - \(.fields.summary)",
            "Updated: \(.fields.updated)",
            "",
            "Description:",
            "",
            (
              .fields.description.content[]? |
              if .type == "paragraph" then
                ([.content[]?.text] | join(""))
              elif .type == "bulletList" then
                (
                  .content[]? |
                  "• " +
                  (
                    .content[]?.content[]?.text
                  )
                )
              else
                ""
              end
            ),
            ""
          '
